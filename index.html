<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Créditos">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Cotizador de Créditos</title>
<style>
  :root{
    --bg:#12151c;
    --panel:#1b2029;
    --panel-2:#20263080;
    --ink:#ede9de;
    --muted:#8b92a0;
    --line:#2a3040;
    --brass:#c9a24b;
    --brass-dim:#8f7938;
    --green:#4f7942;
    --danger:#b25b4a;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2028 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 18px 24px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  header.top .brand{
    font-family:Georgia, "Times New Roman", ui-serif, serif;
    font-size:1.5rem;
    letter-spacing:0.02em;
    font-weight:700;
  }
  header.top .brand span{ color:var(--brass); }
  header.top .tag{
    font-size:0.68rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{
    margin:0 0 14px;
    font-family:Georgia, "Times New Roman", ui-serif, serif;
    font-weight:600;
    font-size:1rem;
    color:var(--brass);
    letter-spacing:0.01em;
  }
  .field{
    margin-bottom:14px;
  }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field .input-row{
    display:flex;
    align-items:center;
    background:#12151c;
    border:1px solid var(--line);
    border-radius:10px;
    padding:0 12px;
  }
  .field .input-row .prefix{
    color:var(--muted);
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:1.05rem;
    padding-right:4px;
  }
  .field input{
    flex:1;
    background:transparent;
    border:0;
    outline:none;
    color:var(--ink);
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:1.15rem;
    padding:12px 0;
    min-width:0;
  }
  .field input::placeholder{ color:#4b5261; }
  .field .suffix{
    color:var(--muted);
    font-size:0.95rem;
    padding-left:6px;
  }

  .plans{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .plan-chip{
    position:relative;
  }
  .plan-chip input{
    position:absolute;
    opacity:0;
    inset:0;
    margin:0;
    cursor:pointer;
  }
  .plan-chip .box{
    border:1px solid var(--line);
    background:#12151c;
    border-radius:10px;
    padding:10px 6px;
    text-align:center;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    transition:border-color .15s, background .15s;
  }
  .plan-chip .box .n{
    display:block;
    font-size:1.15rem;
    font-weight:600;
  }
  .plan-chip .box .l{
    display:block;
    font-size:0.62rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-top:2px;
  }
  .plan-chip input:checked + .box{
    border-color:var(--brass);
    background:#241d10;
  }
  .plan-chip input:checked + .box .n{ color:var(--brass); }

  button.calc{
    width:100%;
    margin-top:16px;
    background:var(--brass);
    color:#181307;
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:1rem;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  button.calc:active{ background:var(--brass-dim); }

  /* --- Receipt / ledger result --- */
  .receipt{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:none;
  }
  .receipt.show{ display:block; }
  .receipt .rhead{
    padding:16px 18px 12px;
    border-bottom:1px dashed var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .receipt .rhead .cap-label{
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
  }
  .receipt .rhead .cap-val{
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:1.4rem;
    font-weight:700;
    color:var(--ink);
  }
  .receipt .rhead .tem-val{
    text-align:right;
    font-size:0.8rem;
    color:var(--brass);
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
  }
  .plan-row{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .plan-row:last-child{ border-bottom:0; }
  .plan-row .n-badge{
    width:40px;
    height:40px;
    flex:0 0 auto;
    border:1px solid var(--brass-dim);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-weight:700;
    color:var(--brass);
    font-size:0.95rem;
  }
  .plan-row .details{ flex:1; min-width:0; }
  .plan-row .details .cuota{
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:1.05rem;
    font-weight:600;
  }
  .plan-row .details .meta{
    font-size:0.74rem;
    color:var(--muted);
    margin-top:2px;
  }
  .plan-row .details .meta b{ color:#b7bcc6; font-weight:500; }
  .plan-row .incl{
    flex:0 0 auto;
    position:relative;
  }
  .plan-row .incl input{
    position:absolute;
    opacity:0;
    inset:0;
    margin:0;
    cursor:pointer;
  }
  .plan-row .incl .dot{
    width:22px;
    height:22px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#12151c;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .plan-row .incl input:checked + .dot{
    background:var(--green);
    border-color:var(--green);
  }
  .plan-row .incl input:checked + .dot::after{
    content:"✓";
    color:#eef2ea;
    font-size:0.8rem;
    font-weight:700;
  }

  .msg-actions{
    padding:16px 18px 18px;
  }
  textarea.msg-preview{
    width:100%;
    background:#12151c;
    border:1px solid var(--line);
    border-radius:10px;
    color:#cfd3da;
    font-family:ui-monospace, "SF Mono", Menlo, monospace;
    font-size:0.82rem;
    line-height:1.5;
    padding:12px;
    resize:vertical;
    min-height:140px;
  }
  .btn-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .btn-row button{
    flex:1;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    padding:12px;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-row button.primary{
    background:var(--green);
    border-color:var(--green);
    color:#eef2ea;
  }
  .btn-row button:active{ opacity:0.75; }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--brass);
    color:#181307;
    padding:10px 18px;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .foot-note{
    text-align:center;
    color:#4b5261;
    font-size:0.68rem;
    margin-top:18px;
    letter-spacing:0.03em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brand">Cotizador de <span>Créditos</span></div>
      <div class="tag">Préstamos personales</div>
    </div>
  </header>

  <div class="card">
    <h2>Datos del préstamo</h2>
    <div class="field">
      <label for="capital">Capital</label>
      <div class="input-row">
        <span class="prefix">$</span>
        <input id="capital" inputmode="decimal" type="text" placeholder="0" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label for="tem">TEM · Tasa efectiva mensual</label>
      <div class="input-row">
        <input id="tem" inputmode="decimal" type="text" placeholder="0" autocomplete="off">
        <span class="suffix">%</span>
      </div>
    </div>
    <div class="field">
      <label for="fecha">Fecha de otorgamiento</label>
      <div class="input-row">
        <input id="fecha" type="date">
      </div>
    </div>
    <div class="field">
      <label>Planes a cotizar</label>
      <div class="plans" id="plans">
        <!-- generado por JS -->
      </div>
    </div>
    <button class="calc" id="calcBtn">Cotizar</button>
  </div>

  <div class="receipt" id="receipt">
    <div class="rhead">
      <div>
        <div class="cap-label">Capital</div>
        <div class="cap-val" id="rCapital">$0</div>
      </div>
      <div class="tem-val" id="rTem">TEM 0%</div>
    </div>
    <div id="rows"></div>
    <div class="msg-actions">
      <label style="display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--muted); margin-bottom:8px;">
        Mensaje para WhatsApp
      </label>
      <textarea class="msg-preview" id="msgPreview" readonly></textarea>
      <div class="btn-row">
        <button id="copyBtn">Copiar texto</button>
        <button class="primary" id="waBtn">Enviar por WhatsApp</button>
      </div>
    </div>
  </div>

  <div class="foot-note">Cálculo 100% local · sin conexión requerida</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PLAN_DEFS = [1,3,6,9,12,18];
  var STORAGE_TEM = "cotizador_creditos_tem";

  var plansEl = document.getElementById("plans");
  var capitalEl = document.getElementById("capital");
  var temEl = document.getElementById("tem");
  var fechaEl = document.getElementById("fecha");
  var calcBtn = document.getElementById("calcBtn");
  var receiptEl = document.getElementById("receipt");
  var rowsEl = document.getElementById("rows");
  var rCapitalEl = document.getElementById("rCapital");
  var rTemEl = document.getElementById("rTem");
  var msgPreviewEl = document.getElementById("msgPreview");
  var copyBtn = document.getElementById("copyBtn");
  var waBtn = document.getElementById("waBtn");
  var toastEl = document.getElementById("toast");

  var lastResults = []; // {n, cuota, total, dueDates:[Date,...]}
  var includeState = {}; // n -> bool

  // ---------- setup ----------
  function buildPlanChips(){
    plansEl.innerHTML = "";
    PLAN_DEFS.forEach(function(n){
      var wrap = document.createElement("label");
      wrap.className = "plan-chip";
      var input = document.createElement("input");
      input.type = "checkbox";
      input.value = n;
      input.checked = true;
      input.dataset.n = n;
      var box = document.createElement("div");
      box.className = "box";
      box.innerHTML = '<span class="n">'+n+'</span><span class="l">'+(n===1 ? "cuota" : "cuotas")+'</span>';
      wrap.appendChild(input);
      wrap.appendChild(box);
      plansEl.appendChild(wrap);
    });
  }

  function todayISO(){
    var d = new Date();
    var tz = d.getTimezoneOffset();
    d = new Date(d.getTime() - tz*60000);
    return d.toISOString().slice(0,10);
  }

  function loadLastTem(){
    try{
      var v = localStorage.getItem(STORAGE_TEM);
      if(v !== null){ temEl.value = v; }
    }catch(e){}
  }

  function saveLastTem(v){
    try{ localStorage.setItem(STORAGE_TEM, v); }catch(e){}
  }

  // ---------- number / date helpers ----------
  function parseNum(str){
    if(!str) return NaN;
    // acepta "1234,56" o "1234.56" o "1.234,56"
    var s = String(str).trim();
    s = s.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return n;
  }

  function fmtMoney(n){
    var rounded = Math.round(n);
    return "$" + rounded.toLocaleString("es-AR");
  }

  function fmtDate(d){
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    return dd + "/" + mm + "/" + yy;
  }

  function addMonths(date, months){
    var d = new Date(date.getTime());
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return d;
  }

  function parseFechaInput(val){
    // val = "YYYY-MM-DD" del input date, en horario local para evitar desfasajes
    var parts = val.split("-");
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }

  // ---------- cálculo ----------
  function calcPlan(n, capital, i, fechaOtorg){
    if(n === 1){
      var total = capital * (1 + i);
      var venc = addMonths(fechaOtorg, 1);
      return { n:1, cuota: total, total: total, dueDates: [venc] };
    }
    // sistema francés, cuota fija
    var cuota;
    if(i === 0){
      cuota = capital / n;
    } else {
      cuota = capital * i * Math.pow(1+i, n) / (Math.pow(1+i, n) - 1);
    }
    var dueDates = [];
    for(var k=1; k<=n; k++){
      dueDates.push(addMonths(fechaOtorg, k));
    }
    return { n:n, cuota: cuota, total: cuota * n, dueDates: dueDates };
  }

  // ---------- render ----------
  function renderResults(capital, i, temPct, results){
    rCapitalEl.textContent = fmtMoney(capital);
    rTemEl.textContent = "TEM " + temPct + "%";
    rowsEl.innerHTML = "";

    results.forEach(function(r){
      includeState[r.n] = (includeState[r.n] !== undefined) ? includeState[r.n] : true;

      var row = document.createElement("div");
      row.className = "plan-row";

      var badge = document.createElement("div");
      badge.className = "n-badge";
      badge.textContent = r.n;

      var details = document.createElement("div");
      details.className = "details";
      var cuotaLine = document.createElement("div");
      cuotaLine.className = "cuota";
      cuotaLine.textContent = (r.n === 1 ? "Único pago: " : (r.n + " x ")) + fmtMoney(r.cuota);
      var metaLine = document.createElement("div");
      metaLine.className = "meta";
      if(r.n === 1){
        metaLine.innerHTML = "Vence <b>" + fmtDate(r.dueDates[0]) + "</b> · Total <b>" + fmtMoney(r.total) + "</b>";
      } else {
        metaLine.innerHTML = "1ª <b>" + fmtDate(r.dueDates[0]) + "</b> · última <b>" + fmtDate(r.dueDates[r.dueDates.length-1]) + "</b> · Total <b>" + fmtMoney(r.total) + "</b>";
      }
      details.appendChild(cuotaLine);
      details.appendChild(metaLine);

      var incl = document.createElement("label");
      incl.className = "incl";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = includeState[r.n];
      cb.addEventListener("change", function(){
        includeState[r.n] = cb.checked;
        updateMessage(capital, temPct, results);
      });
      var dot = document.createElement("div");
      dot.className = "dot";
      incl.appendChild(cb);
      incl.appendChild(dot);

      row.appendChild(badge);
      row.appendChild(details);
      row.appendChild(incl);
      rowsEl.appendChild(row);
    });

    receiptEl.classList.add("show");
    updateMessage(capital, temPct, results);
    receiptEl.scrollIntoView({ behavior:"smooth", block:"nearest" });
  }

  function buildMessage(capital, temPct, results){
    var lines = [];
    lines.push("💰 *Cotización de crédito*");
    lines.push("Capital: " + fmtMoney(capital));
    lines.push("");
    results.forEach(function(r){
      if(!includeState[r.n]) return;
      if(r.n === 1){
        lines.push("📌 1 cuota de " + fmtMoney(r.cuota));
      } else {
        lines.push("📌 " + r.n + " cuotas de " + fmtMoney(r.cuota));
      }
    });
    return lines.join("\n");
  }

  function updateMessage(capital, temPct, results){
    msgPreviewEl.value = buildMessage(capital, temPct, results);
  }

  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add("show");
    setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  // ---------- eventos ----------
  calcBtn.addEventListener("click", function(){
    var capital = parseNum(capitalEl.value);
    var temPct = parseNum(temEl.value);
    var fechaVal = fechaEl.value;

    if(!capital || capital <= 0){
      showToast("Ingresá un capital válido");
      capitalEl.focus();
      return;
    }
    if(isNaN(temPct) || temPct < 0){
      showToast("Ingresá una TEM válida");
      temEl.focus();
      return;
    }
    if(!fechaVal){
      showToast("Elegí la fecha de otorgamiento");
      return;
    }

    var checked = Array.prototype.slice.call(plansEl.querySelectorAll("input:checked"))
      .map(function(el){ return parseInt(el.dataset.n, 10); });

    if(checked.length === 0){
      showToast("Elegí al menos un plan");
      return;
    }

    saveLastTem(temEl.value);

    var i = temPct / 100;
    var fechaOtorg = parseFechaInput(fechaVal);

    includeState = {}; // reset selección de inclusión en mensaje
    var results = checked.sort(function(a,b){return a-b;}).map(function(n){
      return calcPlan(n, capital, i, fechaOtorg);
    });
    lastResults = results;

    renderResults(capital, i, temEl.value, results);
  });

  copyBtn.addEventListener("click", function(){
    msgPreviewEl.select();
    msgPreviewEl.setSelectionRange(0, 999999);
    try{
      document.execCommand("copy");
      showToast("Texto copiado");
    }catch(e){
      if(navigator.clipboard){
        navigator.clipboard.writeText(msgPreviewEl.value).then(function(){
          showToast("Texto copiado");
        });
      }
    }
    if(window.getSelection){ window.getSelection().removeAllRanges(); }
  });

  waBtn.addEventListener("click", function(){
    var text = encodeURIComponent(msgPreviewEl.value);
    window.location.href = "https://wa.me/?text=" + text;
  });

  // ---------- init ----------
  buildPlanChips();
  loadLastTem();
  fechaEl.value = todayISO();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
